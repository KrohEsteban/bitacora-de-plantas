services:
  bitacora:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - bitacora-data:/app/data
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  bitacora-data:
    name: bitacora-data
