name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'releases/**'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint + tests + E2E (make ci)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet

      - name: Run make ci
        run: make ci