name: CD

# Deployment pipeline. Triggered on every push to the release branches; the
# actual deploy step will be added once an AWS target exists.
on:
  push:
    branches:
      - main
      - master
      - 'releases/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
